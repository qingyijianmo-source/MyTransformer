name: CPU quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pytest sacrebleu python-docx
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run CPU tests
        # Invoke pytest through the configured interpreter so the repository
        # root is on sys.path and top-level project modules are importable.
        run: python -m pytest
